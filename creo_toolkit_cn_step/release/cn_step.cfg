# cn_step.cfg
# 放在「启动 Creo 时的工作目录」下（程序按当前目录找它）
# 路径写绝对路径最稳；写相对路径则相对 Creo 的工作目录解析。
#
# 中文名有两个去处，互不替代：
#   FILE_NAME  决定磁盘上文件叫什么
#   PRODUCT    决定装配树里组件显示什么

# STEP 输出目录（不存在会自动创建）
outdir=D://cn_step_out

# 名称对照表，两列 CSV：导出名,中文名
# 装配组件名优先取 STEP 内部已有的中文（Creo 会把装配里设的组件名称
# 写进 NAUO，程序自动回填），查不到才用这张表。顶层装配同理。
mapping=D://cn_step_out//名称对照.csv

# 改写文件头 FILE_NAME（1=改）
rewrite_header=1

# 改写装配体内部 PRODUCT 的 id/name（1=改；改完装配树里就是中文）
rewrite_products=1

# 额外生成一份 Creo 回读副本 <名字>_creo.stp（1=生成）
# 为什么要两份：SolidWorks 只认 ISO 标准的 \X2\ 转义，Creo 的导入器
# 反过来不认转义、只认 UTF-8 原始字节。一份文件不可能两边都显示中文。
# 用 Creo 回读，就打开 _creo 那份。
creo_copy=1

# 对照表编码：utf8 / ansi
encoding=utf8
